{% extends 'accounts/base.html' %}

{% block title %}
Register
{% endblock %}

{% block content %}

<div class="container py-3">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card shadow">

                <div class="card-body p-5">

                    <h2 class="text-center mb-4">
                        Create Account
                    </h2>

                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="POST">

                        {% csrf_token %}

                        <!-- Name -->

                        <div class="row mb-3">

                            <div class="col-md-5">
                                <label class="form-label">First Name</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    name="first_name"
                                    required>
                            </div>

                            <div class="col-md-2">
                                <label class="form-label">M.I.</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    name="middle_initial"
                                    maxlength="1">
                            </div>

                            <div class="col-md-5">
                                <label class="form-label">Last Name</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    name="last_name"
                                    required>
                            </div>

                        </div>

                        <!-- Email -->

                        <div class="mb-3">

                            <label class="form-label">
                                Email Address
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                name="email"
                                required>

                        </div>

                        <!-- Role -->

                        <div class="mb-3">

                            <label class="form-label">
                                Register As
                            </label>

                            <select
                                class="form-select"
                                name="role"
                                required>

                                <option value="" selected disabled>
                                    Select Role
                                </option>

                                <option value="staff">
                                    Clinic Staff
                                </option>

                                <option value="doctor">
                                    Doctor
                                </option>

                            </select>

                        </div>

                        <!-- Password -->

                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                name="password"
                                required>

                        </div>

                        <!-- Confirm Password -->

                        <div class="mb-4">

                            <label class="form-label">
                                Confirm Password
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                name="confirm_password"
                                required>

                        </div>

                        <!-- Register Button -->

                        <button
                            type="submit"
                            class="btn btn-success w-100">

                            Register

                        </button>

                    </form>

                    <div class="text-center mt-4">

                        Already have an account?

                        <a href="{% url 'login' %}">
                            Login
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
