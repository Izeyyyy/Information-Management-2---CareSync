{% extends 'accounts/base.html' %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="container vh-100 d-flex justify-content-center align-items-center">

    <div class="card shadow p-5" style="width:420px;">

        <h2 class="text-center mb-4">
            CareSync
        </h2>

        <h5 class="text-center mb-4">
            Welcome Back
        </h5>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">

                <label>Email</label>

                <input
                    type="text"
                    class="form-control"
                    name="email"
                    required
                >

            </div>

            <div class="mb-3">

                <label>Password</label>

                <input
                    type="password"
                    class="form-control"
                    name="password"
                    required
                >

            </div>

            <button type="submit" class="btn btn-primary w-100">

                Login

            </button>

        </form>

        <div class="text-center mt-3">

            Don't have an account?

            <a href="{% url 'registration' %}">Register</a>

        </div>

    </div>

</div>

{% endblock %}
